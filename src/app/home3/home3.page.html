<ion-content [fullscreen]="true">
  <ion-grid class="ion-text-center">

    <div *ngIf="loading">
      <ion-row>
        <ion-col class="content_box">
          <div class="small_logo_img" loading="lazy" src=""></div>
          <div  class="massage_img skeleton-img" ></div>
          <ion-text>
            <h4 class="home_heading"></h4>
            <h6 class="home_para"></h6>
          </ion-text>
          <div class="dot-dots">
          <div *ngFor="let dot_deta of arr_data; let i = index">
            <div *ngIf="dot_deta.status == 1; else inActivedots">
              <div *ngIf="i == 0; else inactive_dots">
                <div class="dot active"></div>
              </div>
              <ng-template #inactive_dots>
                <div class="dot"></div>
              </ng-template>
            </div>
            <ng-template #inActivedots>
          
            </ng-template>        
          </div>       
        </div>
          <div class="button_space" col-md="12">
            <ion-button  expand="block" class="theme_btn_skip-skeleton skeleton-button" ></ion-button>
            <ion-button  expand="block" class="theme_btn_skip-skeleton skeleton-button" ></ion-button>
          </div>   
        </ion-col>
      </ion-row>  
    </div>




    <!-- ============= -->
    <div *ngIf="splashContent">
      <ion-row>
        <ion-col class="content_box">
          <ion-img class="small_logo_img" loading="lazy" src="/assets/header-logo.png"></ion-img>
          <ion-img  class="massage_img" [src]="splashContent.image_name"></ion-img>
          <ion-text>
            <h4 class="home_heading">{{splashContent.display_text}}</h4>
            <h6 class="home_para">{{splashContent.display_sub_text}}</h6>
          </ion-text>
          <div class="dot-dots">
            <div *ngFor="let dot_deta of arr_data; let i = index">
              <div *ngIf="dot_deta.status == 1; else inActivedots">
                <div *ngIf="i == 1; else inactive_dots">
                  <div class="dot active"></div>
                </div>
                <ng-template #inactive_dots>
                  <div class="dot"></div>
                </ng-template>
              </div>
              <ng-template #inActivedots>
                <!--<span class="dot">{{i}}</span>-->
              </ng-template>        
            </div>       
          </div>
          <div class="button_space" col-md="12">
            <ion-button  expand="block" class="theme_btn_skip" (click)="navigateTolocation()">Skip</ion-button>
            <ion-button  expand="block" class="theme_btn" (click)="navigateToThirdPage()">Next</ion-button>
          </div>   
        </ion-col>
      </ion-row>  
    </div>
  </ion-grid>  
</ion-content>
