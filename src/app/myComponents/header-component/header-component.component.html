<ion-header class="header_fix">
  <ion-toolbar class="ion_toolbar">
    <div class="outer_header_div">
      <ion-row size="12">
       <ion-col size="6">
        <div class="header_logo_outer_div"> 
          <ion-img (click)="navigateToTabsTab1()" src="./assets/header-logo.png" alt=""></ion-img>
        </div>     
       </ion-col>
       <ion-col size="6">
        <div class="start_end" (click)="navigateToViewCart()">
          <ion-img class="header_icon" src="/assets/cart-outline.svg"></ion-img>
          <ion-badge class="ion_badge" id="cart-badge">{{cart_quantity}}</ion-badge>
        </div> 
       </ion-col>
      </ion-row> 
    </div>
  </ion-toolbar>
</ion-header>
